# in0brain's keyboard and mouse layout for bbport (bbport.ini entries).
# Apply with tools\deploy_windows.ps1 -Settings configs\keymap-in0brain.ini, or copy the lines
# into bbport.ini. Inputs: see the key_* comment in scripts/bbport_settings_table.inc.
#
# Made on the Asia dump (CUSA03023), which uses the Japanese layout: Circle acts and confirms,
# Cross dodges, runs and cancels. On a US or EU dump swap the key_cross and key_circle values.
#
# Mouse: left R1, right L2, shift+left R2, middle or left Alt R3 (lock-on), back side button
# (x1) Cross, front side button (x2) L1, wheel up/down the d-pad's up/down, left Shift with
# the wheel the d-pad's left/right.

mouse_camera=1
mouse_sensitivity=1.00
mouse_invert_y=0
walk_stick=0.40

key_cross=space,mouse_x1
key_circle=f
key_square=2
key_triangle=r
key_l1=mouse_x2
key_r1=mouse_left
key_l2=mouse_right
key_r2=shift+mouse_left
key_l3=z
key_r3=mouse_middle,left_alt
key_options=tab
key_touchpad_left=g
key_touchpad_right=backspace

key_dpad_up=wheel_up
key_dpad_down=wheel_down
key_dpad_left=left_shift+wheel_down
key_dpad_right=left_shift+wheel_up

key_move_up=w
key_move_down=s
key_move_left=a
key_move_right=d
key_walk=left_ctrl
key_camera_up=up
key_camera_down=down
key_camera_left=left
key_camera_right=right
